# Sealed Secrets Private Key Template
# 이 파일은 예시입니다. 실제 키는 kubeseal을 사용하여 생성하거나
# 기존 클러스터에서 백업한 키를 사용하세요.
#
# 사용 방법:
# 1. 기존 클러스터에서 키 백업:
#    kubectl get secret -n sealed-secrets sealed-secrets-key -o yaml > sealed-secrets-key.yaml
#
# 2. 새 클러스터에 키 복원 (sealed-secrets 설치 전):
#    kubectl apply -f sealed-secrets-key.yaml -n sealed-secrets

apiVersion: v1
kind: Secret
metadata:
  name: sealed-secrets-key
  namespace: sealed-secrets
  # sealed-secrets 컨트롤러가 이 키를 자동으로 사용합니다
type: Opaque
data:
  # 실제 키 데이터는 기존 클러스터에서 백업하거나
  # kubeseal --fetch-cert로 생성한 키를 사용하세요
  # 이 파일은 템플릿일 뿐이며, 실제 키 값은 포함하지 않습니다

