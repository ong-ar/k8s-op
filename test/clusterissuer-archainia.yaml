apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-archainia
spec:
  acme:
    email: support@archainia.app
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns01-archainia-account-key
    solvers:
      - dns01:
          cloudDNS:
            project: archainia-mvp
            hostedZoneName: "archainia-app"
            serviceAccountSecretRef:
              name: clouddns-dns01-svc-acct
              key: key.json