apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-hosts
  namespace: ingress-demo
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: app1.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80

    - host: app2.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80

    - host: admin.dev.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80