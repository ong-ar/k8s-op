apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-structure
  # Argo CD 2.6+ Multiple Sources 사용 (Helm repository + Git resources)
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.14.0
      helm:
        values: |
          controller:
            kind: DaemonSet
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            service:
              enabled: false
            config:
              use-forwarded-headers: "true"
            metrics:
              enabled: false
          defaultBackend:
            enabled: true
    - repoURL: https://github.com/ong-ar/k8s-op
      path: git-ops/infra/ingress-nginx
      targetRevision: main
      kustomize: {}  # kustomization.yaml 사용 (resources만 관리)
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

