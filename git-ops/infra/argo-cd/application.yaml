apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  # Argo CD Helm chart는 수동 설치 (helm install)
  # Argo CD는 resources만 관리 (ingress 등)
  source:
    repoURL: https://github.com/ong-ar/k8s-op
    path: git-ops/infra/argo-cd
    targetRevision: main
    kustomize: {}  # kustomization.yaml 사용 (resources만 관리)
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # resources의 namespace에 따라 배포됨
  syncPolicy:
    # automated 없음 = 수동 동기화
    syncOptions:
      - CreateNamespace=true

