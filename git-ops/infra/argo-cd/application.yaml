apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  # Argo CD 2.6+ Multiple Sources 사용 (Helm repository + Git values)
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 8.5.8
    - repoURL: https://github.com/ong-ar/k8s-op  # Git repository URL로 변경 필요
      path: git-ops/infra/argo-cd
      targetRevision: main
      kustomize: {}  # kustomization.yaml 사용 (application.yaml과 values.yaml 제외)
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

