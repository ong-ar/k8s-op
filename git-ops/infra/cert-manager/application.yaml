apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  # Argo CD 2.6+ Multiple Sources 사용 (Helm repository + Git values)
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: 1.19.1
    - repoURL: https://github.com/ong-ar/k8s-op  # Git repository URL로 변경 필요
      path: git-ops/infra/cert-manager
      targetRevision: main
      kustomize: {}  # kustomization.yaml 사용 (application.yaml과 values.yaml 제외)
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

