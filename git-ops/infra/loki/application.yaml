apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-structure
  # Argo CD 2.6+ Multiple Sources 사용 (Helm repository + Git resources)
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    jqPathExpressions:
      - '.spec.volumeClaimTemplates[].metadata.creationTimestamp'
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.41.1
      helm:
        values: |
          loki:
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            storage:
              type: s3
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
                admin: loki-admin
              s3:
                endpoint: http://tenant-loki-hl.tenant-loki.svc.cluster.local:9000
                region: us-east-1
                # accessKeyId, secretAccessKey 제거 (Secret에서 참조)
                s3ForcePathStyle: true
                insecure: true
            
          minio:
            enabled: false
          deploymentMode: SingleBinary
          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              storageClass: longhorn
              accessModes: 
                - ReadWriteOnce
              size: 5Gi
            # Secret에서 자격증명 참조
            extraEnv:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: loki-minio-credentials
                    key: accessKeyId
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: loki-minio-credentials
                    key: secretAccessKey
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0
          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          compactor:
            replicas: 0
          indexGateway:
            replicas: 0
            joinMemberlist: false
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
    - repoURL: https://github.com/ong-ar/k8s-op
      path: git-ops/infra/loki
      targetRevision: main
      kustomize: {}  # kustomization.yaml 사용 (resources만 관리)
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    # automated 없음 = 수동 동기화
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-structure
  # Promtail Helm chart 설치
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: 6.17.0
    helm:
      values: |
        config:
          clients:
            - url: http://loki.loki.svc.cluster.local:3100/loki/api/v1/push
              tenant_id: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    # automated 없음 = 수동 동기화
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
