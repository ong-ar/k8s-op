apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-structure
  # Use Argo CD 2.6+ Multiple Sources (Helm repository + Git resources)
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.41.1
      helm:
        values: |
          loki:
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            storage:
              type: s3
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
                admin: loki-admin
              s3:
                endpoint: http://minio-tenant-shared-hl.minio-tenant.svc.cluster.local:9000
                region: us-east-1
                # Removed accessKeyId, secretAccessKey (Reference from Secret)
                s3ForcePathStyle: true
                insecure: true
            limits_config:
              retention_period: 1h

            compactor:
              retention_enabled: true
              delete_request_store: s3
            
          minio:
            enabled: false
          deploymentMode: SingleBinary
          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              storageClass: longhorn
              accessModes: 
                - ReadWriteOnce
              size: 5Gi
            # Reference credentials from Secret
            extraEnv:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: loki-minio-credentials
                    key: accessKeyId
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: loki-minio-credentials
                    key: secretAccessKey
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0
          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          compactor:
            replicas: 0
          indexGateway:
            replicas: 0
            joinMemberlist: false
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0
          chunksCache:
            enabled: false
          resultsCache:
            enabled: false
    - repoURL: https://github.com/ong-ar/k8s-op
      path: git-ops/infra/loki/loki
      targetRevision: main
      kustomize: {}  # Use kustomization.yaml (manage resources only)
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
