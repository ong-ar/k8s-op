apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sealed-secrets-web-ingress
  namespace: sealed-secrets-web
  annotations:
    nginx.ingress.kubernetes.io/whitelist-source-range: "61.77.247.3/32,125.246.87.242/32"
    # Add this if ingress-nginx defaults to https redirect
    # nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx

  # ⛔ Delete entire tls block
  tls:
    - hosts:
        - sealed-secrets.archainia.app
      secretName: archainia-wildcard-tls

  rules:
    - host: sealed-secrets.archainia.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sealed-secrets-web
                port:
                  number: 80