apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra-structure
  namespace: argo-cd  # AppProject 리소스 자체가 생성되는 namespace (Argo CD가 설치된 namespace)
spec:
  description: Infra-structure components managed by Argo CD
  sourceRepos:
    - '*'  # 모든 Git repository 허용 (필요시 특정 repo로 제한 가능)
  destinations:
    - namespace: '*'  # 이 AppProject가 관리할 수 있는 대상 namespace (Application이 배포할 수 있는 namespace)
      server: '*'  # 모든 namespace와 cluster 허용
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

