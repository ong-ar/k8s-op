apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  # Argo CD 2.6+ Multiple Sources 사용 (Helm repository + Git values)
  sources:
    - repoURL: https://projectcalico.docs.tigera.io/charts
      chart: tigera-operator
      targetRevision: 3.31.0
      helm:
        valueFiles:
          - $values/git-ops/infra/calico/values.yaml
    - repoURL: https://github.com/ong-ar/k8s-op  # Git repository URL로 변경 필요
      targetRevision: main
      ref: values
  
  destination:
    server: https://kubernetes.default.svc
    namespace: tigera-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  
