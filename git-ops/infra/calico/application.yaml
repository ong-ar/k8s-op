apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  # Argo CD 2.6+ Multiple Sources 사용 (Helm repository + Git values)
  sources:
    - repoURL: https://projectcalico.docs.tigera.io/charts
      chart: tigera-operator
      targetRevision: 3.31.0
      helm:
        values: |
          installation:
            enabled: true

            calicoNetwork:
              ipPools:
                - cidr: 192.168.0.0/16
  
  destination:
    server: https://kubernetes.default.svc
    namespace: tigera-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  
