apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calico
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-structure
  # Use Argo CD 2.6+ Multiple Sources (Helm repository + Git resources)
  sources:
    - repoURL: https://projectcalico.docs.tigera.io/charts
      chart: tigera-operator
      targetRevision: 3.31.0
      helm:
        values: |
          installation:
            enabled: true
            calicoNetwork:
              ipPools:
                - cidr: 192.168.0.0/16
    - repoURL: https://github.com/ong-ar/k8s-op
      path: git-ops/infra/calico
      targetRevision: main
      kustomize: {}  # Use kustomization.yaml (manage resources only)
  destination:
    server: https://kubernetes.default.svc
    namespace: tigera-operator
  syncPolicy:
    # No automated sync = Manual sync
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true

