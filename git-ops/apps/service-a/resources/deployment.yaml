apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: ghcr.io/ong-ar/k8s-op-service-a:latest
          ports:
            - containerPort: 3000
          # 핵심: 파일을 복사하고 앱을 실행하는 커맨드
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /etc/secrets/.env ]; then
                cp /etc/secrets/.env .env
                echo ".env file copied from secrets"
              else
                echo "No .env secret found, using defaults"
              fi
              node dist/main
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: secret-volume
          secret:
            secretName: service-a-env-secret
            optional: true # Secret이 없어도 Pod가 뜨긴 하도록 (실제 운영에선 false가 나을 수 있음)

